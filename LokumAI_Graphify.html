        #graph-container {

            font-size: 1.5rem;
            color: #38bdf8;
        }
        p {

            color: #94a3b8;
        }

            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #334155;
        }
        .stat-box {
            text-align: center;
        }
        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #f8fafc;
        }
        .stat-label {
            font-size: 0.75rem;
            color: #64748b;
        }
        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            font-size: 0.8rem;
        }
        .color-box {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
